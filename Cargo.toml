[package]
name = "successions"
version = "0.1.0"
authors = ["Thierry61 <tfavier61@gmail.com>"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
dioxus = { version = "0.7.1", features = [] }

[features]
default = ["web"]
web = ["dioxus/web"]
desktop = ["dioxus/desktop"]
mobile = ["dioxus/mobile"]
# Désactive la gestion des récompenses pour les AV, utilisé pour les tests
# voulant retrouver les mêmes résultats que le simulateur MACSF.
no_compensation = []

[profile.release]
strip = true       # Nécessaire pour créer le bundle en mode release.
